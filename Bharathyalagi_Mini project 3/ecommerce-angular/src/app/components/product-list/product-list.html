<h2>Products</h2>

<div class="grid">
  <div class="card" *ngFor="let p of products">

    <img [src]="p.imageUrl" alt="{{p.name}}" width="150" height="150">

    <h3>{{p.name}}</h3>
    <p>₹ {{p.price}}</p>

    <button (click)="addToCart(p)">Add to Cart</button>

  </div>
</div>

<div class="toast" *ngIf="toastMsg">
  {{toastMsg}}
</div>
